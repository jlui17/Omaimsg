[tools]
node = "24"
# Pinned separately from the node major above, which floats: install.sh resolves
# dependencies through this npm, so a drifting one would resolve a user's install
# differently from the checkout the lockfile was written in.
npm = "11.19.1"

[tasks.setup]
description = "Provision a fresh checkout or worktree with the dependencies the daemon and test servers need"
run = "npm ci"

[tasks.test]
description = "Every check: path derivation, notification shaping, daemon protocol, then the UI"
run = [
  "mise run test:paths",
  "mise run test:notify",
  "mise run test:daemon",
  "mise run test:ui",
]

[tasks."test:paths"]
description = "The plugin id -> state path derivation, in isolation"
run = "node --test test/paths.test.js"

[tasks."test:notify"]
description = "What an inbound message turns into on screen, in isolation"
run = "node --test test/notify.test.js"

[tasks."test:daemon"]
description = "Daemon protocol end to end over the real Unix socket"
run = "node test/smoke.js"

[tasks."test:ui"]
description = "Bar widget and panel, rendered in a headless compositor"
depends = ["stage"]
run = '''
pin=$(jq -r '.mcpServers.quickshell.args as $a | $a[($a|index("--from"))+1]' .mcp.json)
uv run --quiet --with "$pin" python test/qsmcp/check.py
'''

[tasks.stage]
description = "Rebuild the Omarchy shell tree the UI checks boot"
run = "./test/qsmcp/stage.sh"
